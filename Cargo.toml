[workspace]
resolver = "3"
members = ["crates/edm-core", "crates/edm-route", "crates/edm", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
version = "1.0.0"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
disallowed_methods = "deny"
disallowed_types = "deny"
# The port mirrors a JavaScript program; these fire constantly on faithful code
# and their advice would change behaviour.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Exact `f64` equality is not a mistake here — it is what JavaScript's `===`
# does, and several behaviours depend on it (`-0 === 0` is true, `NaN === NaN`
# is false). The sanctioned comparisons live behind `js::js_min`/`js_max`/
# `truthy`/`safe_int`; the rest are transcriptions of TypeScript comparisons.
float_cmp = "allow"
# `Commodity` mirrors the game-internal API's own field set.
struct_excessive_bools = "allow"
# This codebase explains itself in prose, and the lint cannot tell a proper noun
# (ChaCha20, CPython, JavaScript) from an unquoted code item.
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
edm-core = { path = "crates/edm-core" }
edm-route = { path = "crates/edm-route" }

# --- pure (edm-core) ---------------------------------------------------------
serde = { version = "1", features = ["derive"] }
# Lexer only. NO `preserve_order`: it yields *document* order, and F1 requires
# ECMAScript enumeration order. `float_roundtrip` makes the f64 conversion exact.
serde_json = { version = "1", default-features = false, features = ["std", "float_roundtrip"] }
ryu = "1"
chacha20 = { version = "0.10", default-features = false, features = ["cipher", "zeroize"] }
cipher = { version = "0.5", default-features = false }
base64 = "0.23"
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
thiserror = "2"
unicode-width = "0.2"
# Real CLDR root collation. Hand-rolling a subset was tried and abandoned:
# `ß` expands to `ss`, `þ` sorts after `z`, `ø` is a secondary variant of `o`
# and `½` falls between `1` and `2`. JS engines use ICU, so we use ICU.
icu_collator = "2.2"
icu_locale_core = "2.2"

# --- impure (edm) ------------------------------------------------------------
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "net", "io-util"] }
# `http2` is deliberately absent, not merely disabled at runtime: EDDN's
# Developers.md is explicit that HTTP/2 is unsupported, and Bun's fetch is
# HTTP/1.1. Leaving the feature off means the h2 code is never compiled and
# ALPN never offers it, so R68 cannot regress by someone dropping a builder
# call. `charset` is absent because Response.text() must be an unconditional
# lossy UTF-8 decode (R62), and `json` because our serializer is the only one
# allowed to touch a payload (F2).
# Content coding is handled here rather than by reqwest. reqwest decompresses
# transparently and then *removes* `content-encoding` and `content-length` from
# the response headers — but `fetch` leaves both visible, and this program
# prints the header table, so the difference is on screen. Doing it by hand also
# keeps reqwest's magic out of a byte-diff harness.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
flate2 = "1.1"
brotli = "8"
http = "1"
async-channel = "2.5"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
percent-encoding = "2.3"
getrandom = "0.3"
rustix = { version = "1", features = ["process", "system", "termios", "stdio", "fs"] }
anyhow = "1"

# --- terminal UI (edm only) --------------------------------------------------
# `edm ui` only. Neither may reach edm-core or edm-route: the purity gate keeps
# the solver and the renderer free of anything that touches a descriptor.
# crossterm's `events` feature installs a SIGWINCH handler through signal-hook,
# not through tokio's `signal` feature, which R96 keeps off; and raw mode makes
# Ctrl-C a key event rather than a signal, so no handler for SIGINT exists
# here either \[C53\]. No `event-stream`: input is read on a plain thread and
# handed to the runtime over async-channel, which is already here.
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }

# --- dev ---------------------------------------------------------------------
lz4_flex = { version = "0.14", default-features = false, features = ["std"] }
proptest = "1"
insta = "1.48"
regex = "1"
jsonschema = "0.49"
hex-literal = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# BufWriter::drop must still flush on the way out.
panic = "unwind"
strip = "debuginfo"

# Property tests and the differential harness are unusably slow in a debug build.
[profile.dev.package."*"]
opt-level = 2
