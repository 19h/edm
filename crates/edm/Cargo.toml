[package]
name = "edm"
description = "Frontier Companion API market client: poll a market, sweep a system, trade, and publish to EDDN."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "edm"
path = "src/main.rs"

[dependencies]
edm-core.workspace = true
edm-route.workspace = true
tokio.workspace = true
reqwest.workspace = true
flate2.workspace = true
brotli.workspace = true
http.workspace = true
async-channel.workspace = true
futures-util.workspace = true
percent-encoding.workspace = true
getrandom.workspace = true
zeroize = { workspace = true, features = ["derive"] }
rustix.workspace = true
thiserror.workspace = true
anyhow.workspace = true

[features]
default = []
# Record live exchanges to disk and replay them into the test harness.
replay = []

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util", "rt", "macros", "time"] }
insta.workspace = true
proptest.workspace = true

[lints]
workspace = true
