[package]
name = "edm-core"
description = "Pure, I/O-free core of the edm Frontier market client: ECMAScript-compatible primitives, wire codec, table renderer, CLI grammar and domain model."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
ryu.workspace = true
chacha20.workspace = true
