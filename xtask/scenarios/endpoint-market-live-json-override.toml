# endpoint-market-live-json-override
why = "GET /2.0/elite/market/list, one market's commodity listing — sent, JSON output, verb overridden to POST (R66)."
argv = ["market", "--market-id", "3229009408", "--json", "--method", "POST"]

[[route]]
path = "/2.0/elite/market/list"

[[route.reply]]
status = 200
encode = "capi"
payload-file = "payloads/market.json"
