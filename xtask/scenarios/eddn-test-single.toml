why = "`--eddn-test` on a single market: Ardent is asked for the names EDDN requires (ts:2974), the message goes to the /test schema, and success is status 200 with a body that trims to exactly OK (R79). The posted body is compared on the wire, which is where R3 — integral doubles with no `.0` — is decided."
argv = ["market", "--market-id", "3229009408", "--eddn-test"]

[[route]]
path = "/v2/market/3229009408"

[[route.reply]]
status = 200
payload-file = "payloads/ardent-market.json"
headers = [["Content-Type", "application/json"]]

[[route]]
path = "/2.0/elite/market/list"

[[route.reply]]
status = 200
encode = "capi"
payload-file = "payloads/market.json"

[[route]]
path = "/upload/"

[[route.reply]]
status = 200
payload = "OK"
