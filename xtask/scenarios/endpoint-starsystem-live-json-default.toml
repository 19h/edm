# endpoint-starsystem-live-json-default
why = "GET /2.0/elite/starsystem, the market listing for one address — sent, JSON output."
argv = ["markets", "--address", "3238296097059", "--json"]

[[route]]
path = "/2.0/elite/starsystem"

[[route.reply]]
status = 200
encode = "capi"
payload-file = "payloads/starsystem-f1.json"
