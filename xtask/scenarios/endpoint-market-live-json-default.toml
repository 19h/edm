# endpoint-market-live-json-default
why = "GET /2.0/elite/market/list, one market's commodity listing — sent, JSON output."
argv = ["market", "--market-id", "3229009408", "--json"]

[[route]]
path = "/2.0/elite/market/list"

[[route.reply]]
status = 200
encode = "capi"
payload-file = "payloads/market.json"
