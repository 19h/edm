# route-410-is-not-a-failure
why = "HTTP 410 'commodities not currently available at this market' is a correct, permanent answer to a well-formed request: the station is real, it was reached, and it has nothing to trade. A live radius-100 sweep found 40 of 5,089 answering it, and the run counted every one as a failure — reporting that forty markets were 'not reached and absent from the ranking, not ranked low' when all forty had answered — and exited 1. It is neither a success to rank nor a failure to chase, so the coverage block counts it as neither and the exit code stays 0."
argv = ["route", "Sol", "--radius", "10", "--rps", "8", "--no-cache", "--concurrency", "1", "--cargo", "784"]
oracle = "none"

[env]
EDM_JITTER = "0"

[[route]]
path = "/v2/system/name/Sol"

[[route.reply]]
status = 200
payload-file = "payloads/ardent-sol.json"
headers = [["Content-Type", "application/json"]]

[[route]]
path = "/v2/system/name/Sol/nearby"

[[route.reply]]
status = 200
payload-file = "payloads/ardent-nearby-sol.json"
headers = [["Content-Type", "application/json"]]

[[route]]
path = "/v2/system/name/Sol/markets"

[[route.reply]]
status = 200
payload-file = "payloads/ardent-markets-sol.json"
headers = [["Content-Type", "application/json"]]

[[route]]
path = "/v2/system/name/Alpha%20Centauri/markets"

[[route.reply]]
status = 200
payload-file = "payloads/ardent-markets-empty.json"
headers = [["Content-Type", "application/json"]]

[[route]]
path = "/v2/system/name/Barnard's%20Star/markets"

[[route.reply]]
status = 200
payload-file = "payloads/ardent-markets-empty.json"
headers = [["Content-Type", "application/json"]]

# One worker, so the two replies land in listing order: Galileo first.
[[route]]
path = "/2.0/elite/market/list"

[[route.reply]]
status = 200
encode = "game_api"
payload-file = "payloads/market-gold-source.json"

# The game-internal API's answer for a station that has no commodity market.
# Verbatim from a live radius-100 sweep, 2026-08-05.
[[route.reply]]
status = 410
payload = """{"status":410,"message":"commodities not currently available at this market","tag":"8w1s3688r1kff"}"""
