# route-cache-serves-the-second-run
why = "The same argv twice against one cache. The second run prices zero requests in its plan and sends none, and `expect-frontier-requests = 0` counts arrivals across *both* runs — so a cache that quietly re-polled shows up as four rather than as a silently identical answer. The coverage note must say the prices came from the cache: a run served entirely from disk that claims to have read live is the exact untruth that block exists to prevent, and it is what the second live run of this command printed before it was fixed."
argv = ["route", "Sol", "--radius", "10", "--rps", "8", "--concurrency", "1", "--cargo", "784"]
oracle = "none"
run-twice = true
expect-frontier-requests = 0

[env]
EDM_JITTER = "0"

[[route]]
path = "/v2/system/name/Sol"

[[route.reply]]
status = 200
payload-file = "payloads/ardent-sol.json"
headers = [["Content-Type", "application/json"]]

[[route]]
path = "/v2/system/name/Sol/nearby"

[[route.reply]]
status = 200
payload-file = "payloads/ardent-nearby-sol.json"
headers = [["Content-Type", "application/json"]]

[[route]]
path = "/v2/system/name/Sol/markets"

[[route.reply]]
status = 200
payload-file = "payloads/ardent-markets-sol.json"
headers = [["Content-Type", "application/json"]]

[[route]]
path = "/v2/system/name/Alpha%20Centauri/markets"

[[route.reply]]
status = 200
payload-file = "payloads/ardent-markets-empty.json"
headers = [["Content-Type", "application/json"]]

[[route]]
path = "/v2/system/name/Barnard's%20Star/markets"

[[route.reply]]
status = 200
payload-file = "payloads/ardent-markets-empty.json"
headers = [["Content-Type", "application/json"]]

# Both surviving starports answer with a listing.
[[route]]
path = "/2.0/elite/market/list"

# Two replies, for the first run. The second is supposed to need none, and the
# request counter over that run alone is what says so.
[[route.reply]]
status = 200
encode = "capi"
payload-file = "payloads/market-gold-source.json"

[[route.reply]]
status = 200
encode = "capi"
payload-file = "payloads/market-gold-sink.json"
