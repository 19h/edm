# route-unreached-is-not-unprofitable
why = "One market answers and one never does. The run exits 1 and the coverage block names the market it could not read, because a market missing from the ranking because it failed must never be indistinguishable from one missing because it was unprofitable. The 500s are retried and then retired on the attempt cap rather than looping."
argv = ["route", "Sol", "--radius", "10", "--rps", "8", "--no-cache", "--concurrency", "1", "--deadline", "3"]
oracle = "none"

# Jitter pinned so the attempt count is a property of the budget rather than
# of a random draw [C29]. Without it the run retries somewhere between four and
# nine times and the scenario asserts nothing.
[env]
EDM_JITTER = "0"


[[route]]
path = "/v2/system/name/Sol"

[[route.reply]]
status = 200
payload-file = "payloads/ardent-sol.json"
headers = [["Content-Type", "application/json"]]

[[route]]
path = "/v2/system/name/Sol/nearby"

[[route.reply]]
status = 200
payload-file = "payloads/ardent-nearby-sol.json"
headers = [["Content-Type", "application/json"]]

[[route]]
path = "/v2/system/name/Sol/markets"

[[route.reply]]
status = 200
payload-file = "payloads/ardent-markets-sol.json"
headers = [["Content-Type", "application/json"]]

[[route]]
path = "/v2/system/name/Alpha%20Centauri/markets"

[[route.reply]]
status = 200
payload-file = "payloads/ardent-markets-empty.json"
headers = [["Content-Type", "application/json"]]

[[route]]
path = "/v2/system/name/Barnard's%20Star/markets"

[[route.reply]]
status = 200
payload-file = "payloads/ardent-markets-empty.json"
headers = [["Content-Type", "application/json"]]

# One market answers; the other never does, and is retired rather than retried
# forever. The single worker keeps the two apart.
[[route]]
path = "/2.0/elite/market/list"

[[route.reply]]
status = 200
encode = "game_api"
payload-file = "payloads/market-small.json"

[[route.reply]]
status = 500

[[route.reply]]
status = 500

[[route.reply]]
status = 500

[[route.reply]]
status = 500

[[route.reply]]
status = 500

[[route.reply]]
status = 500

[[route.reply]]
status = 500

[[route.reply]]
status = 500
