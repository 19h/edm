# fail-302
why = "302 with a Location header: the game-internal API client follows no redirects (R67), so this is reported as a plain failure."
argv = ["market", "--market-id", "3229009408"]

[[route]]
path = "/2.0/elite/market/list"

[[route.reply]]
status = 302
headers = [["Location", "https://elsewhere.example/2.0/elite/market/list"]]
