# A registered divergence, asserted rather than ignored.
why = "COLUMNS of twenty digits. Number(COLUMNS) is 1e20, and the original's `\"=\".repeat(1e20)` throws a RangeError at module initialisation — outside main's try/catch, so Bun reports an uncaught error with a stack trace. C11 clamps to 10,000 instead. This scenario passes when the two sides differ; if they ever agree, C11 has become untrue and the row should be deleted."
argv = ["help"]
columns = "99999999999999999999"
network = false
divergence = "C11"
