# route-ranks-a-round-trip
why = "The whole pipeline, end to end: two markets that trade in opposite directions, swept live, ingested into the optimiser and ranked. Gold flows one way and silver the other — which is forced, not arranged: a station's buy price always exceeds its sell price, so for any one commodity at most one direction of a pair can pay, and the two legs of a round trip necessarily carry different cargo. `--detail` prints both legs and what limited each."
argv = ["route", "Sol", "--radius", "10", "--rps", "8", "--no-cache", "--concurrency", "1", "--cargo", "784", "--detail"]
oracle = "none"
expect-frontier-requests = 2

[env]
EDM_JITTER = "0"

[[route]]
path = "/v2/system/name/Sol"

[[route.reply]]
status = 200
payload-file = "payloads/ardent-sol.json"
headers = [["Content-Type", "application/json"]]

[[route]]
path = "/v2/system/name/Sol/nearby"

[[route.reply]]
status = 200
payload-file = "payloads/ardent-nearby-sol.json"
headers = [["Content-Type", "application/json"]]

[[route]]
path = "/v2/system/name/Sol/markets"

[[route.reply]]
status = 200
payload-file = "payloads/ardent-markets-sol.json"
headers = [["Content-Type", "application/json"]]

[[route]]
path = "/v2/system/name/Alpha%20Centauri/markets"

[[route.reply]]
status = 200
payload-file = "payloads/ardent-markets-empty.json"
headers = [["Content-Type", "application/json"]]

[[route]]
path = "/v2/system/name/Barnard's%20Star/markets"

[[route.reply]]
status = 200
payload-file = "payloads/ardent-markets-empty.json"
headers = [["Content-Type", "application/json"]]

# One worker, so the two replies land in listing order: Galileo first.
[[route]]
path = "/2.0/elite/market/list"

[[route.reply]]
status = 200
encode = "game_api"
payload-file = "payloads/market-gold-source.json"

[[route.reply]]
status = 200
encode = "game_api"
payload-file = "payloads/market-gold-sink.json"
